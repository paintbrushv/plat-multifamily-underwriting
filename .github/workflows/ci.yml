name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (offline core, no LLM extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test suite (offline, no credentials)
        env:
          ANTHROPIC_API_KEY: ""
          LANGEXTRACT_MODEL_ID: ""
        run: |
          pytest -q -m "not integration and not slow"
