[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plat-multifamily-underwriting"
version = "0.1.2"
description = "Deterministic multifamily underwriting engine: rent roll and T12 ingestion, schema-validated deals, monthly cashflow and waterfall math, and statute-cited property tax regimes"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "paintbrush"}
]
keywords = [
    "multifamily",
    "real-estate",
    "underwriting",
    "cashflow",
    "rent-roll",
    "t12",
    "property-tax",
    "proptech",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Office/Business :: Financial :: Investment",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
# Dep audit (module-level imports only; everything else is lazy and guarded):
# jsonschema (validator), lxml (xlsx_writer), matplotlib (pdf_onepager,
# portfolio_pdf, pptx_generator), openpyxl (excel_io, excel_output,
# xlsx_helpers, portfolio_xlsx, modules/yardi_etl), pptx (pptx_generator),
# reportlab (pdf_onepager, portfolio_pdf), python-dateutil (rediq_bridge).
# Lazy/optional: pandas (legacy .xls rent rolls; dev extra), pdfplumber
# (om_parser), pyyaml (market_integration config loads; own ImportError
# guard), pandas+pyarrow (engine.market_data feeder providers; market
# extra), anthropic+langextract (om-llm extra only).
dependencies = [
    "jsonschema>=4.0",
    "lxml>=4.9",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "python-dateutil>=2.8",
    "python-pptx>=0.6",
    "reportlab>=4.0",
    "xlrd>=2.0",
]

[project.scripts]
plat-uw = "engine.cli:run"
plat-underwriting-mcp = "engine.mcp_server:main"

[project.urls]
Homepage = "https://github.com/paintbrushv/plat-multifamily-underwriting"
Repository = "https://github.com/paintbrushv/plat-multifamily-underwriting"
Issues = "https://github.com/paintbrushv/plat-multifamily-underwriting/issues"
Changelog = "https://github.com/paintbrushv/plat-multifamily-underwriting/blob/main/README.md"

[project.optional-dependencies]
mcp = [
    "mcp>=2.3,<3",
]
dev = [
    "pytest>=7.0",
    "mcp>=2.3,<3",
    "pdfplumber>=0.10",
    # The legacy .xls rent-roll parser imports pandas lazily; the parser test
    # exercises that path. (xlrd is a core dependency.)
    "pandas>=2.0",
    # Market-data provider tests read synthetic feeder parquet files.
    "pyarrow>=14",
]
# Market-data providers (engine.market_data) read feeder parquet outputs.
# Without this extra the parquet-backed providers report available() == False.
market = [
    "pandas>=2.0",
    "pyarrow>=14",
]
# Opt-in OM extraction via a hosted LLM (needs ANTHROPIC_API_KEY at runtime).
# The core engine, parsers, validator, and tax logic never import these.
om-llm = [
    "anthropic>=0.25",
    "langextract>=1.0.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*"]

[tool.setuptools.package-data]
# The bundled synthetic sample deal (load_sample_deal) ships with the package.
engine = ["schemas/*.json", "samples/sample_deal/*"]
"engine.schemas" = ["*.json"]
# The sample deal (docs/USER_GUIDE.md): documents and profile; build_sample.py ships as a module.
"engine.samples.sample_deal" = ["*.xlsx", "*.json"]
# The analyst screens (engine/ui): plain JS and CSS inlined into each page at import time.
"engine.ui" = ["static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that hit live external services (excluded from CI)",
    "slow: long-running tests excluded from the default fast loop",
]
